[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-research-oracle"
version = "0.1.0"
description = "Local-first document-only research harness with opt-in AWS adapters"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.40,<2"]

[tool.setuptools.packages.find]
include = ["oracle*"]
